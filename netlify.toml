[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/serp"
  to = "/.netlify/functions/serp"
  status = 200
  force = true

[[redirects]]
  from = "/api/keywords"
  to = "/.netlify/functions/keywords"
  status = 200
  force = true
